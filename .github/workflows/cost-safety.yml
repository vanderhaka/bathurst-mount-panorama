name: Cost safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  cost-safety:
    name: Cost safety review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Check out trusted base separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Test and run the trusted review gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: enabled
        run: |
          set -euo pipefail
          gate_dir="$GITHUB_WORKSPACE/trusted-base/.github/cost-safety"
          base_gate_entry=$(git -C trusted-base ls-tree "$BASE_SHA" -- .github/cost-safety/gate.py)
          if [ -n "$base_gate_entry" ]; then
            if [ ! -f "$gate_dir/gate.py" ]; then
              echo '::error::Trusted gate exists in git but was not checked out; refusing fallback.'
              exit 1
            fi
          else
            echo '::warning::BOOTSTRAP: base has no gate. Running candidate installation; independent review is required before merging. This is not established enforcement.'
            gate_dir="$GITHUB_WORKSPACE/candidate/.github/cost-safety"
          fi
          python3 "$gate_dir/test_gate.py"
          python3 "$gate_dir/gate.py" --repo "$GITHUB_WORKSPACE/candidate" --base "$BASE_SHA" --head "$HEAD_SHA"
